name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      # npm's allow-scripts guard leaves electron's postinstall pending, and
      # the Electron integration test needs the real binary on disk.
      - name: Electron binary
        shell: bash
        run: |
          node node_modules/electron/install.js
          test -f node_modules/electron/dist/electron.exe
          echo "electron.exe present"
          # electron#45251/#52307: a dist without its locale packs crashes
          # the renderer on Windows — print the actual state for diagnosis.
          echo "electron locales: $(ls node_modules/electron/dist/locales/*.pak 2>/dev/null | wc -l) pack(s); en-US=$(test -f node_modules/electron/dist/locales/en-US.pak && echo present || echo MISSING)"
      - name: Typecheck (main/preload)
        run: npx tsc --noEmit -p tsconfig.main.json
      - name: Typecheck (renderer)
        run: npx tsc --noEmit
      - name: Lint (baseline 9 errors / 195 problems)
        shell: bash
        run: |
          npx eslint src -f json -o eslint.json || true
          node -e 'const r=require("./eslint.json");const e=r.reduce((s,f)=>s+f.errorCount,0);const w=r.reduce((s,f)=>s+f.warningCount,0);console.log(`eslint: ${e} errors, ${w} warnings`);if(e>9||e+w>195)process.exit(1);'
      # Must run before tests: worker threads resolve dist/imaging/*.js and the
      # Electron integration test boots the built app.
      - name: Build
        run: npm run build
      # The native addon is required here: the Electron integration test boots
      # the app, whose CLI entry constructs a DiskEnumerator at module load.
      # --ignore-scripts skips src/native's own install hook (its bundled
      # node-gyp predates Visual Studio 2026); the root node-gyp 12 builds it.
      - name: Native deps
        working-directory: src/native
        run: npm ci --ignore-scripts
      - name: Native addon
        shell: bash
        run: npm run build:native
      - name: Unit tests
        run: npx vitest run
