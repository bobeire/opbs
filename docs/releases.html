<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Releases — OPBS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0c1220; color: #d0d7e3; line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #61d0ff; text-decoration: none; }
    a:hover { color: #9be2ff; }
    .wrapper { max-width: 860px; margin: 0 auto; padding: 0 24px; }

    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(12, 18, 32, 0.88); backdrop-filter: blur(10px);
      border-bottom: 1px solid #1e2d44;
    }
    nav { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .logo { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.15rem; color: #fff; }
    .logo img { height: 34px; border-radius: 6px; }
    nav ul { list-style: none; display: flex; gap: 28px; }
    nav ul li a { color: #a3b1c6; font-size: 0.92rem; font-weight: 500; }
    nav ul li a:hover { color: #fff; }

    main { padding: 56px 0 72px; }
    h1 { color: #fff; font-size: 1.9rem; margin-bottom: 8px; }
    .sub { color: #8fa5c0; margin-bottom: 40px; }
    .sub a { font-size: 0.9rem; }

    .release {
      background: #0f1929; border: 1px solid #1e2d44; border-radius: 14px;
      padding: 28px; margin-bottom: 28px;
    }
    .release h2 { color: #fff; font-size: 1.25rem; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .release .date { color: #586a82; font-size: 0.85rem; }
    .release .tag { background: #1a2d4a; border-radius: 6px; padding: 2px 10px; font-size: 0.8rem; color: #61d0ff; }
    .release pre {
      background: #111b2c; border: 1px solid #1e2d44; border-radius: 8px;
      padding: 16px; white-space: pre-wrap; word-break: break-word;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.85rem; color: #a3b1c6; margin-top: 16px;
    }
    .assets { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .asset {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px; font-size: 0.85rem;
      background: #152238; border: 1px solid #2a4467; color: #d0d7e3; }
    .asset:hover { border-color: #2a5a9a; color: #fff; }

    .loader, .error { text-align: center; padding: 48px 0; color: #8fa5c0; }
    .error a { font-size: 0.9rem; }

    footer { text-align: center; padding: 48px 0; font-size: 0.82rem; color: #586a82; border-top: 1px solid #1e2d44; }
  </style>
</head>
<body>

<header>
  <div class="wrapper">
    <nav>
      <a href="index.html" class="logo">
        <img src="https://raw.githubusercontent.com/bobeire/opbs/master/resources/icon.png" alt="OPBS icon" />
        OPBS
      </a>
      <ul>
        <li><a href="index.html#features">Features</a></li>
        <li><a href="index.html#download">Download</a></li>
        <li><a href="releases.html">Releases</a></li>
        <li><a href="https://github.com/bobeire/opbs" target="_blank">GitHub</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="wrapper">
  <h1>Releases</h1>
  <p class="sub" id="sub-ref">
    Recent releases, mirrored from
    <a href="https://github.com/bobeire/opbs/releases" target="_blank">GitHub Releases</a>.
  </p>
  <div id="releases">
    <div class="loader">Loading releases…</div>
  </div>
</main>

<footer class="wrapper">
  &copy; 2026 RHITCS &middot;
  <a href="https://github.com/bobeire/opbs/blob/master/LICENSE" target="_blank">GPL-3.0</a> &middot;
  <a href="https://github.com/bobeire/opbs" target="_blank">GitHub</a>
</footer>

<script>
  (async () => {
    const ele = document.getElementById('releases');
    try {
      const res = await fetch('https://api.github.com/repos/bobeire/opbs/releases?per_page=10');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const releases = await res.json();
      if (!releases.length) {
        ele.innerHTML = '<p class="error">No releases yet — check back soon.</p>';
        return;
      }
      ele.innerHTML = releases.map(release => {
        const body = (release.body || '*No release notes provided.*')
          .replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const assets = (release.assets || []).map(asset =>
          '<a class="asset" href="' + asset.browser_download_url + '">⬇ ' + asset.name + '</a>'
        ).join('');
        return '' +
          '<div class="release">' +
            '<h2>' + release.name + ' <span class="tag">' + release.tag_name + '</span></h2>' +
            '<div class="date">' + new Date(release.published_at).toLocaleDateString(undefined, {
              year: 'numeric', month: 'long', day: 'numeric' }) + '</div>' +
            '<pre>' + body + '</pre>' +
            (assets ? '<div class="assets">' + assets + '</div>' : '') +
          '</div>';
      }).join('');
    } catch (err) {
      ele.innerHTML =
        '<div class="error">' +
          'Could not load release notes right now (' + err.message + ').<br/>' +
          '<a href="https://github.com/bobeire/opbs/releases">Browse releases on GitHub →</a>' +
        '</div>';
    }
  })();
</script>

</body>
</html>
