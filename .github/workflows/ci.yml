name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      # npm's allow-scripts guard leaves electron's postinstall pending, and
      # the Electron integration test needs the real binary on disk.
      - name: Electron binary
        shell: bash
        run: |
          node node_modules/electron/install.js
          test -f node_modules/electron/dist/electron.exe
          echo "electron.exe present"
      - name: Typecheck (main/preload)
        run: npx tsc --noEmit -p tsconfig.main.json
      - name: Typecheck (renderer, baseline 16)
        shell: bash
        run: |
          npx tsc --noEmit > tsc-renderer.log 2>&1 || true
          count=$(grep -c "error TS" tsc-renderer.log || true)
          echo "renderer tsc errors: $count (baseline 16)"
          if [ "$count" -gt 16 ]; then
            cat tsc-renderer.log
            exit 1
          fi
      - name: Lint (baseline 9 errors / 195 problems)
        shell: bash
        run: |
          npx eslint src -f json -o eslint.json || true
          node -e 'const r=require("./eslint.json");const e=r.reduce((s,f)=>s+f.errorCount,0);const w=r.reduce((s,f)=>s+f.warningCount,0);console.log(`eslint: ${e} errors, ${w} warnings`);if(e>9||e+w>195)process.exit(1);'
      # Must run before tests: worker threads resolve dist/imaging/*.js and the
      # Electron integration test boots the built app.
      - name: Build
        run: npm run build
      - name: Native addon (tests skip without it)
        shell: bash
        run: npm run build:native || echo "::warning::native build failed; native-dependent tests will skip"
      - name: Unit tests
        run: npx vitest run
